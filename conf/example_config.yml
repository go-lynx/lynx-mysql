lynx:
  mysql:
    # Optional. Defaults to "mysql" when omitted.
    driver: "mysql"

    # Canonical DSN field from conf/mysql.proto.
    source: "user:password@tcp(localhost:3306)/app?charset=utf8mb4&parseTime=True&loc=Local&timeout=10s&readTimeout=30s&writeTimeout=30s"

    # Pool sizing.
    min_conn: 5
    max_conn: 20
    max_idle_conn: 5

    # Pool lifetime controls.
    max_idle_time: "300s"
    max_life_time: "3600s"

# Metrics wiring notes:
# 1. The plugin maintains a private Prometheus registry and exposes it via mysql.GetMetricsGatherer().
# 2. Your application must merge that gatherer into its own /metrics endpoint; the plugin does not expose HTTP by itself.
# 3. The current runtime line does not support a lynx.mysql.prometheus config block. Namespace/subsystem are fixed to lynx/mysql.
# 4. Pool / health / connect metrics are wired automatically. Query / transaction metrics require callers to use sql-sdk query-monitor helpers instead of raw *sql.DB calls.
